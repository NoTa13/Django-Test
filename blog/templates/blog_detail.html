<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ object.title }}</title>
    <!-- Подключаем стили Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h1 class="card-title text-primary fw-bold mb-3">{{ object.title }}</h1>
                        <p class="card-text text-secondary fs-5">{{ object.content }}</p>
                        <hr class="my-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-danger fs-6 px-3 py-2">
                                ❤️ Лайков / Просмотров: {{ object.views_count }}
                            </span>
                            <a href="#" class="btn btn-outline-primary btn-sm">Назад к списку</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
